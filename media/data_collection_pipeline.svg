  <text x="145" y="84"  text-anchor="middle" font-size="13" fill="#111">Head camera</text>
  <text x="145" y="103" text-anchor="middle" font-size="13" fill="#111">D435i</text>

  <rect x="245" y="60" width="150" height="60" fill="#fff" stroke="#333" stroke-width="1.4" rx="3"/>
  <text x="320" y="84"  text-anchor="middle" font-size="13" fill="#111">Left Wrist</text>
  <text x="320" y="103" text-anchor="middle" font-size="13" fill="#111">D405</text>

