  <line x1="735" y1="120" x2="735" y2="252" stroke="#333" stroke-width="1.6"/>
  <text x="735" y="274" text-anchor="middle" font-size="12" font-weight="bold" fill="#111">ZMQ port 5557</text>
  <text x="735" y="293" text-anchor="middle" font-size="11" fill="#555">g1_debug</text>
  <text x="735" y="309" text-anchor="middle" font-size="11" fill="#555">(joint pos, vel, IMU, quaternion)</text>
  <text x="735" y="325" text-anchor="middle" font-size="11" fill="#555">+ robot_config</text>
  <line x1="735" y1="338" x2="735" y2="557" stroke="#333" stroke-width="1.6" marker-end="url(#arw)"/>

  <line x1="985" y1="120" x2="985" y2="252" stroke="#333" stroke-width="1.6"/>
  <text x="985" y="274" text-anchor="middle" font-size="12" font-weight="bold" fill="#111">ZMQ port 5556</text>
  <text x="985" y="293" text-anchor="middle" font-size="11" fill="#555">pose (SMPL params)</text>
  <text x="985" y="309" text-anchor="middle" font-size="11" fill="#555">+ manager_state</text>
  <text x="985" y="325" text-anchor="middle" font-size="11" fill="#555">+ recorder toggle</text>
  <line x1="985" y1="338" x2="985" y2="557" stroke="#333" stroke-width="1.6" marker-end="url(#arw)"/>

