  <text x="590" y="1040" text-anchor="middle" font-size="13" fill="#111">process_dataset.py</text>

  <line x1="590" y1="1058" x2="590" y2="1095" stroke="#333" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="590" y="1118" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">LeRobot v2.1 dataset (cleaned)</text>
