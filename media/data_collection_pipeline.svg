  <text x="302" y="625" text-anchor="middle" font-size="9.5" fill="#777">CONFLATE — 큐 없음</text>

  <rect x="665" y="590" width="140" height="46" fill="#fff" stroke="#555" stroke-width="1.2" rx="3"/>
  <text x="735" y="608" text-anchor="middle" font-size="11.5" fill="#111">proprio (5557)</text>
  <text x="735" y="625" text-anchor="middle" font-size="9.5" fill="#777">CONFLATE — 큐 없음</text>

  <rect x="890" y="590" width="190" height="46" fill="#fff" stroke="#c0392b" stroke-width="1.4" rx="3"/>
