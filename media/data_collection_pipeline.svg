  <rect x="390" y="412" width="170" height="20" fill="#fff" stroke="#888" stroke-width="1" rx="2"/>
  <text x="475" y="426" text-anchor="middle" font-size="10" fill="#333">camera_forwarder_3cam.py</text>
  <rect x="390" y="434" width="170" height="20" fill="#fff" stroke="#888" stroke-width="1" rx="2"/>
  <text x="475" y="448" text-anchor="middle" font-size="10" fill="#333">docker container</text>

