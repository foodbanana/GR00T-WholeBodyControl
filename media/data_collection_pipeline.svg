  <rect x="232" y="656" width="140" height="44" fill="#fff" stroke="#555" stroke-width="1.2" rx="3"/>
  <text x="302" y="683" text-anchor="middle" font-size="11" fill="#111">최신 1칸</text>

  <rect x="665" y="656" width="140" height="44" fill="#fff" stroke="#555" stroke-width="1.2" rx="3"/>
  <text x="735" y="683" text-anchor="middle" font-size="11" fill="#111">최신 1칸</text>

  <rect x="890" y="656" width="190" height="21" fill="#fff" stroke="#555" stroke-width="1.2" rx="2"/>
  <text x="985" y="671" text-anchor="middle" font-size="10" fill="#111">pose / planner — 최신 1칸</text>
  <rect x="890" y="679" width="190" height="21" fill="#fff" stroke="#555" stroke-width="1.2" rx="2"/>
  <text x="985" y="694" text-anchor="middle" font-size="10" fill="#111">버튼 토글 플래그 (에피소드 제어)</text>

  <line x1="302" y1="700" x2="302" y2="717" stroke="#333" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="735" y1="700" x2="735" y2="717" stroke="#333" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="985" y1="700" x2="985" y2="717" stroke="#333" stroke-width="1.6" marker-end="url(#arw)"/>

