  <text x="680" y="740" text-anchor="middle" font-size="11.5" fill="#111">저장 게이트 — ① 카메라 새 프레임인가  ② 25Hz 그리드에 맞는가 (--camera-triggered / --dataset-fps)</text>
  <text x="680" y="762" text-anchor="middle" font-size="11.5" fill="#111">통과 시 1 프레임 = { proprio 스냅샷 + teleop 스냅샷 + 이미지 3장 }</text>

  <line x1="400" y1="774" x2="400" y2="796" stroke="#333" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="680" y1="774" x2="680" y2="796" stroke="#333" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="960" y1="774" x2="960" y2="796" stroke="#333" stroke-width="1.6" marker-end="url(#arw)"/>

  <rect x="335" y="799" width="130" height="34" fill="#fff" stroke="#555" stroke-width="1.2" rx="3"/>
