  <rect x="610" y="799" width="140" height="34" fill="#fff" stroke="#555" stroke-width="1.2" rx="3"/>
  <text x="680" y="815" text-anchor="middle" font-size="11" fill="#111">proprio file</text>
  <text x="680" y="828" text-anchor="middle" font-size="11" fill="#111">(parquet)</text>
  <rect x="890" y="799" width="140" height="34" fill="#fff" stroke="#555" stroke-width="1.2" rx="3"/>
  <text x="960" y="815" text-anchor="middle" font-size="11" fill="#111">meta, info</text>
  <text x="960" y="828" text-anchor="middle" font-size="11" fill="#111">files</text>

  <text x="245" y="852" font-size="9.5" fill="#777">에피소드 데이터는 episode_buffer(RAM)에 쌓였다가 저장 시 parquet 로 flush</text>
  <text x="245" y="868" font-size="9.5" fill="#777">이미지는 카메라별 VideoWriter 큐(50칸) → 전용 인코딩 스레드</text>

  <rect x="950" y="862" width="170" height="18" fill="#fff" stroke="#888" stroke-width="1" rx="2"/>
  <text x="1035" y="875" text-anchor="middle" font-size="10" fill="#333">run_data_exporter.py</text>

