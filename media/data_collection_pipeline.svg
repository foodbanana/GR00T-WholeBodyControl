  <rect x="490" y="925" width="200" height="46" fill="#fff" stroke="#333" stroke-width="1.4" rx="3"/>
  <text x="590" y="953" text-anchor="middle" font-size="13" fill="#111">verify_dataset.py</text>

  <line x1="590" y1="971" x2="590" y2="1008" stroke="#333" stroke-width="1.6" marker-end="url(#arw)"/>

