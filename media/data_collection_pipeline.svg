  <line x1="145" y1="120" x2="145" y2="192" stroke="#333" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="155" y="152" font-size="11" fill="#555">640 x 480</text>
  <text x="155" y="168" font-size="11" fill="#555">29-30 Hz</text>

  <line x1="320" y1="120" x2="320" y2="192" stroke="#333" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="330" y="152" font-size="11" fill="#555">640 x 480</text>
  <text x="330" y="168" font-size="11" fill="#555">30 Hz</text>

  <line x1="495" y1="120" x2="495" y2="192" stroke="#333" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="505" y="152" font-size="11" fill="#555">640 x 480</text>
  <text x="505" y="168" font-size="11" fill="#555">30 Hz</text>

