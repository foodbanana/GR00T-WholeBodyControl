    <rect x="260" y="290" width="24" height="30" rx="2"/>
    <rect x="284" y="290" width="24" height="30" rx="2"/>
    <rect x="308" y="290" width="24" height="30" rx="2"/>
    <rect x="332" y="290" width="24" height="30" rx="2"/>
    <rect x="356" y="290" width="24" height="30" rx="2"/>
  </g>
  <line x1="320" y1="320" x2="320" y2="357" stroke="#333" stroke-width="1.6" marker-end="url(#arw)"/>

  <line x1="495" y1="264" x2="495" y2="287" stroke="#333" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="433" y="283" font-size="9" fill="#666">링버퍼 5칸</text>
  <g fill="#fff" stroke="#555" stroke-width="1.2">
    <rect x="435" y="290" width="24" height="30" rx="2"/>
    <rect x="459" y="290" width="24" height="30" rx="2"/>
