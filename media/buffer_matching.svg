<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="700" viewBox="0 0 1040 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#333"/>
    </marker>
    <marker id="a2r" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c0392b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="700" fill="#ffffff"/>

  <!-- ===================== PANEL 1 ===================== -->
  <text x="30" y="32" font-size="15" font-weight="bold" fill="#111">① 캡처 → 버퍼 → 발행  (카메라 1대당 스레드 2개)</text>

  <!-- column headers -->
  <text x="75"  y="62" text-anchor="middle" font-size="11" fill="#777">카메라</text>
  <text x="215" y="62" text-anchor="middle" font-size="11" fill="#777">grabber 스레드</text>
  <text x="348" y="62" text-anchor="middle" font-size="11" fill="#777">RAW 슬롯</text>
  <text x="480" y="62" text-anchor="middle" font-size="11" fill="#777">encoder 스레드</text>
  <text x="660" y="62" text-anchor="middle" font-size="11" fill="#777">JPEG 버퍼</text>
  <text x="900" y="62" text-anchor="middle" font-size="11" fill="#777">발행 루프</text>

  <!-- ========== head row ========== -->
  <rect x="30" y="76" width="90" height="44" fill="#fff" stroke="#333" stroke-width="1.4" rx="3"/>
  <text x="75" y="94"  text-anchor="middle" font-size="11" fill="#111">머리</text>
  <text x="75" y="110" text-anchor="middle" font-size="11" fill="#555">≈29Hz</text>
  <line x1="120" y1="98" x2="148" y2="98" stroke="#333" stroke-width="1.5" marker-end="url(#a2)"/>

  <rect x="150" y="76" width="130" height="44" fill="#fff" stroke="#333" stroke-width="1.4" rx="3"/>
  <text x="215" y="94"  text-anchor="middle" font-size="11" fill="#111">캡처만</text>
  <text x="215" y="110" text-anchor="middle" font-size="10" fill="#777">(인코딩 안 함)</text>
  <line x1="280" y1="98" x2="303" y2="98" stroke="#333" stroke-width="1.5" marker-end="url(#a2)"/>

  <rect x="305" y="80" width="86" height="36" fill="#f2f2f2" stroke="#555" stroke-width="1.2" rx="3"/>
  <text x="348" y="97"  text-anchor="middle" font-size="10" fill="#111">최신 1칸</text>
  <text x="348" y="109" text-anchor="middle" font-size="9"  fill="#777">덮어쓰기</text>
  <line x1="391" y1="98" x2="413" y2="98" stroke="#333" stroke-width="1.5" marker-end="url(#a2)"/>

  <rect x="415" y="76" width="130" height="44" fill="#fff" stroke="#333" stroke-width="1.4" rx="3"/>
  <text x="480" y="94"  text-anchor="middle" font-size="11" fill="#111">JPEG 인코딩</text>
  <text x="480" y="110" text-anchor="middle" font-size="10" fill="#777">항상 최신만</text>
  <line x1="545" y1="98" x2="568" y2="98" stroke="#333" stroke-width="1.5" marker-end="url(#a2)"/>

  <rect x="570" y="78" width="180" height="40" fill="#fff" stroke="#333" stroke-width="1.4" rx="3"/>
  <text x="660" y="94"  text-anchor="middle" font-size="11" font-weight="bold" fill="#111">LatestFrame</text>
  <text x="660" y="109" text-anchor="middle" font-size="10" fill="#555">최신 1칸</text>

  <!-- ========== left wrist row ========== -->
  <rect x="30" y="150" width="90" height="44" fill="#fff" stroke="#333" stroke-width="1.4" rx="3"/>
  <text x="75" y="168" text-anchor="middle" font-size="11" fill="#111">왼손목</text>
  <text x="75" y="184" text-anchor="middle" font-size="11" fill="#555">30Hz</text>
  <line x1="120" y1="172" x2="148" y2="172" stroke="#333" stroke-width="1.5" marker-end="url(#a2)"/>

  <rect x="150" y="150" width="130" height="44" fill="#fff" stroke="#333" stroke-width="1.4" rx="3"/>
  <text x="215" y="177" text-anchor="middle" font-size="11" fill="#111">캡처만</text>
  <line x1="280" y1="172" x2="303" y2="172" stroke="#333" stroke-width="1.5" marker-end="url(#a2)"/>

  <rect x="305" y="154" width="86" height="36" fill="#f2f2f2" stroke="#555" stroke-width="1.2" rx="3"/>
  <text x="348" y="176" text-anchor="middle" font-size="10" fill="#111">최신 1칸</text>
  <line x1="391" y1="172" x2="413" y2="172" stroke="#333" stroke-width="1.5" marker-end="url(#a2)"/>

  <rect x="415" y="150" width="130" height="44" fill="#fff" stroke="#333" stroke-width="1.4" rx="3"/>
  <text x="480" y="177" text-anchor="middle" font-size="11" fill="#111">JPEG 인코딩</text>
  <line x1="545" y1="172" x2="568" y2="172" stroke="#333" stroke-width="1.5" marker-end="url(#a2)"/>

  <text x="660" y="146" text-anchor="middle" font-size="11" font-weight="bold" fill="#111">WristRingBuffer (5칸)</text>
  <g stroke="#333" stroke-width="1.2" fill="#fff">
    <rect x="570" y="154" width="36" height="36" rx="2"/>
    <rect x="606" y="154" width="36" height="36" rx="2"/>
    <rect x="642" y="154" width="36" height="36" rx="2"/>
    <rect x="678" y="154" width="36" height="36" rx="2"/>
    <rect x="714" y="154" width="36" height="36" rx="2"/>
  </g>
  <text x="588" y="176" text-anchor="middle" font-size="10" fill="#777">t-4</text>
  <text x="624" y="176" text-anchor="middle" font-size="10" fill="#777">t-3</text>
  <text x="660" y="176" text-anchor="middle" font-size="10" fill="#777">t-2</text>
  <text x="696" y="176" text-anchor="middle" font-size="10" fill="#777">t-1</text>
  <text x="732" y="176" text-anchor="middle" font-size="10" fill="#777">t</text>

  <!-- ========== right wrist row ========== -->
  <rect x="30" y="222" width="90" height="44" fill="#fff" stroke="#333" stroke-width="1.4" rx="3"/>
  <text x="75" y="240" text-anchor="middle" font-size="11" fill="#111">오른손목</text>
  <text x="75" y="256" text-anchor="middle" font-size="11" fill="#555">30Hz</text>
  <line x1="120" y1="244" x2="148" y2="244" stroke="#333" stroke-width="1.5" marker-end="url(#a2)"/>

  <rect x="150" y="222" width="130" height="44" fill="#fff" stroke="#333" stroke-width="1.4" rx="3"/>
  <text x="215" y="249" text-anchor="middle" font-size="11" fill="#111">캡처만</text>
  <line x1="280" y1="244" x2="303" y2="244" stroke="#333" stroke-width="1.5" marker-end="url(#a2)"/>

  <rect x="305" y="226" width="86" height="36" fill="#f2f2f2" stroke="#555" stroke-width="1.2" rx="3"/>
  <text x="348" y="248" text-anchor="middle" font-size="10" fill="#111">최신 1칸</text>
  <line x1="391" y1="244" x2="413" y2="244" stroke="#333" stroke-width="1.5" marker-end="url(#a2)"/>

  <rect x="415" y="222" width="130" height="44" fill="#fff" stroke="#333" stroke-width="1.4" rx="3"/>
  <text x="480" y="249" text-anchor="middle" font-size="11" fill="#111">JPEG 인코딩</text>
  <line x1="545" y1="244" x2="568" y2="244" stroke="#333" stroke-width="1.5" marker-end="url(#a2)"/>

  <g stroke="#333" stroke-width="1.2" fill="#fff">
    <rect x="570" y="226" width="36" height="36" rx="2"/>
    <rect x="606" y="226" width="36" height="36" rx="2"/>
    <rect x="642" y="226" width="36" height="36" rx="2"/>
    <rect x="678" y="226" width="36" height="36" rx="2"/>
    <rect x="714" y="226" width="36" height="36" rx="2"/>
  </g>

  <!-- publish loop box -->
  <rect x="800" y="76" width="200" height="190" fill="#fafafa" stroke="#333" stroke-width="1.6" rx="4"/>
  <text x="900" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#111">발행 루프</text>
  <text x="900" y="128" text-anchor="middle" font-size="10.5" fill="#333">머리 슬롯 ts 가</text>
  <text x="900" y="143" text-anchor="middle" font-size="10.5" fill="#333">바뀔 때까지 대기</text>
  <text x="900" y="166" text-anchor="middle" font-size="10.5" fill="#333">→ 손목 버퍼에서</text>
  <text x="900" y="181" text-anchor="middle" font-size="10.5" fill="#333">가장 가까운 프레임</text>
  <text x="900" y="196" text-anchor="middle" font-size="10.5" fill="#333">선택 (②)</text>
  <text x="900" y="222" text-anchor="middle" font-size="10.5" fill="#333">→ 3장 묶어 발행</text>
  <rect x="828" y="234" width="144" height="22" fill="#fff" stroke="#555" stroke-width="1.1" rx="2"/>
  <text x="900" y="249" text-anchor="middle" font-size="10" fill="#111">ZMQ PUB 5555</text>

  <line x1="750" y1="98"  x2="797" y2="98"  stroke="#333" stroke-width="1.5" marker-end="url(#a2)"/>
  <line x1="750" y1="172" x2="797" y2="150" stroke="#333" stroke-width="1.5" marker-end="url(#a2)"/>
  <line x1="750" y1="244" x2="797" y2="210" stroke="#333" stroke-width="1.5" marker-end="url(#a2)"/>

  <text x="30" y="296" font-size="11" fill="#555">· grabber 는 읽기만 한다 — 인코딩까지 하면 그동안 드라이버 버퍼에 프레임이 쌓여 지연이 누적된다.</text>
  <text x="30" y="313" font-size="11" fill="#555">· encoder 는 큐가 아니라 &quot;최신 슬롯&quot;을 읽는다 — 인코딩이 느려도 밀린 프레임은 건너뛰므로 지연이 쌓이지 않는다.</text>

  <line x1="30" y1="336" x2="1010" y2="336" stroke="#ddd" stroke-width="1"/>

  <!-- ===================== PANEL 2 ===================== -->
  <text x="30" y="372" font-size="15" font-weight="bold" fill="#111">② head 도착 시점에 가장 가까운 손목 프레임 선택 (head-anchored nearest timestamp)</text>

  <!-- head arrival -->
  <text x="600" y="410" text-anchor="middle" font-size="12" font-weight="bold" fill="#111">머리 프레임 도착 = anchor</text>
  <line x1="600" y1="418" x2="600" y2="486" stroke="#333" stroke-width="2" marker-end="url(#a2)"/>
  <text x="612" y="452" font-size="11" fill="#555">이 순간이 &quot;저장할 시점&quot;</text>

  <!-- wrist timeline -->
  <text x="30" y="500" font-size="11" fill="#777">손목</text>
  <text x="30" y="514" font-size="11" fill="#777">30Hz</text>
  <line x1="80" y1="520" x2="960" y2="520" stroke="#999" stroke-width="1.2"/>
  <text x="965" y="524" font-size="11" fill="#999">시간 →</text>

  <!-- ring buffer window bracket -->
  <path d="M420,472 L420,462 L610,462 L610,472" fill="none" stroke="#666" stroke-width="1.2"/>
  <text x="515" y="455" text-anchor="middle" font-size="11" fill="#444">링버퍼 5칸 ≈ 166ms 커버</text>

  <!-- wrist frame ticks -->
  <g>
    <circle cx="430" cy="520" r="7" fill="#fff" stroke="#333" stroke-width="1.4"/>
    <circle cx="475" cy="520" r="7" fill="#fff" stroke="#333" stroke-width="1.4"/>
    <circle cx="520" cy="520" r="7" fill="#fff" stroke="#333" stroke-width="1.4"/>
    <circle cx="565" cy="520" r="7" fill="#fff" stroke="#333" stroke-width="1.4"/>
    <circle cx="610" cy="520" r="9" fill="#c0392b" stroke="#c0392b" stroke-width="1.4"/>
  </g>
  <text x="430" y="546" text-anchor="middle" font-size="10" fill="#777">t-4</text>
  <text x="475" y="546" text-anchor="middle" font-size="10" fill="#777">t-3</text>
  <text x="520" y="546" text-anchor="middle" font-size="10" fill="#777">t-2</text>
  <text x="565" y="546" text-anchor="middle" font-size="10" fill="#777">t-1</text>
  <text x="610" y="546" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0392b">t</text>

  <!-- delta -->
  <line x1="600" y1="492" x2="610" y2="492" stroke="#c0392b" stroke-width="1.6" marker-end="url(#a2r)"/>
  <text x="626" y="496" font-size="11" font-weight="bold" fill="#c0392b">|Δ| 최소 → 이 프레임 선택</text>

  <text x="30" y="584" font-size="11" fill="#555">· 손목을 &quot;최신 1칸&quot;만 두면 머리와 무관하게 자유 실행하므로 평균 반 프레임(≈16ms) 어긋난다.</text>
  <text x="30" y="601" font-size="11" fill="#555">· 5칸을 두면 머리가 조금 이르거나 늦게 도착해도 가장 가까운 프레임을 고를 수 있다.</text>
  <text x="30" y="618" font-size="11" fill="#555">· |Δ| ≥ 33ms (한 프레임) 이면 손목이 정상 30Hz 가 아니라는 뜻 → [sync] WARN 출력.</text>
  <text x="30" y="635" font-size="11" fill="#555">· 손목 버퍼가 비어 있으면 그 회차는 통째로 건너뛴다 — 이미지 2장짜리 반쪽 페이로드는 내보내지 않는다.</text>
  <text x="30" y="659" font-size="11" fill="#555">· payload 의 timestamps 는 3대 모두 머리의 시각을 쓴다. 실제 카메라별 오프셋은 [sync] Δ 로그로만 확인한다.</text>
</svg>
